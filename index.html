<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>MS Online IPTV</title>
  <link rel="stylesheet" href="style.css">
  <!-- JW Player: replace YOUR_JWPLAYER_LIBRARY_ID with your own JW Player library ID -->
  <script src="https://cdn.jwplayer.com/libraries/YOUR_JWPLAYER_LIBRARY_ID.js"></script>
</head>
<body>
  <main class="app-container">
    <section id="player-container" aria-label="Video player">
      <div id="player">
        <div id="overlay-message" role="status" aria-live="polite">
          একটি চ্যানেল নির্বাচন করুন
        </div>
      </div>
      <button id="custom-fullscreen" type="button" aria-label="ভিডিও ফুলস্ক্রিন করুন" title="ফুলস্ক্রিন">
        <span aria-hidden="true">⛶</span>
      </button>
    </section>

    <section class="playlist-container" aria-label="Channel list">
      <div class="category-tabs-container">
        <button class="scroll-button left" type="button" aria-label="আগের ক্যাটাগরি">‹</button>
        <div class="category-tabs-scroll">
          <div class="category-tabs" id="category-tabs"></div>
        </div>
        <button class="scroll-button right" type="button" aria-label="পরের ক্যাটাগরি">›</button>
      </div>
      <div class="channels-container" id="channels-container"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
