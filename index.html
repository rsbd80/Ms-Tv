<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV Player</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0f0f;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Player area */
        #player-wrapper {
            position: relative;
            width: 100%;
            height: 45vh;
            background: #000;
            flex-shrink: 0;
        }
        #player { width: 100%; height: 100%; }

        #overlay-message {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 16px;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        /* Category tabs */
        .category-tabs-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            flex-shrink: 0;
        }
        .category-tabs-scroll {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
            flex: 1;
            padding: 8px 4px;
        }
        .category-tabs-scroll::-webkit-scrollbar { display: none; }

        .category-tab {
            flex-shrink: 0;
            padding: 8px 16px;
            margin: 0 4px;
            background: #2a2a2a;
            color: #ccc;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.2s;
            user-select: none;
        }
        .category-tab:hover { background: #3a3a3a; }
        .category-tab.active {
            background: #e50914;
            color: #fff;
            font-weight: 600;
        }

        .scroll-button {
            display: none;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 100%;
            background: #1a1a1a;
            color: #fff;
            border: none;
            cursor: pointer;
            font-size: 18px;
            z-index: 5;
            flex-shrink: 0;
        }
        .scroll-button:hover { background: #2a2a2a; }

        /* Channels grid */
        #channels-container {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            padding: 12px;
            background: #0f0f0f;
        }

        .channel-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .channel-card:hover {
            transform: translateY(-3px);
            border-color: #555;
        }
        .channel-card.active {
            border-color: #e50914;
            box-shadow: 0 0 12px rgba(229,9,20,0.5);
        }

        .channel-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: contain;
            background: #000;
            display: block;
        }

        .channel-info { padding: 8px; }
        .channel-name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-category {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        @media (max-width: 600px) {
            #player-wrapper { height: 35vh; }
            #channels-container {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 8px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Player -->
    <div id="player-wrapper">
        <div id="player"></div>
        <div id="overlay-message"></div>
    </div>

    <!-- Category tabs -->
    <div class="category-tabs-wrapper">
        <button class="scroll-button left">‹</button>
        <div class="category-tabs-scroll">
            <div id="category-tabs" style="display:flex;"></div>
        </div>
        <button class="scroll-button right">›</button>
    </div>

    <!-- Channel list -->
    <div id="channels-container"></div>

    <!-- ==================== স্ক্রিপ্ট লোডিং ==================== -->

    <!-- 1. Clappr Core -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/core@latest/dist/clappr-core.min.js"></script>

    <!-- 2. hls.js (অবশ্যই Clappr HLS প্লাগইনের আগে) -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

    <!-- 3. Clappr HLS Playback প্লাগইন -->
    <script src="https://cdn.jsdelivr.net/npm/@clappr/hlsjs-playback@3/dist/hlsjs-playback.min.js"></script>

    <!-- 4. আপনার অ্যাপ লজিক -->
    <script src="app.js"></script>

</body>
</html>
